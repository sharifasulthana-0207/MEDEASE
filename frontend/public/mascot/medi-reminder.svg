<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Soft shadow -->
  <ellipse cx="100" cy="225" rx="55" ry="10" fill="#168C89" opacity="0.15" />

  <!-- Tiny Feet -->
  <rect x="74" y="200" width="16" height="22" rx="8" fill="#126B70" />
  <rect x="110" y="200" width="16" height="22" rx="8" fill="#126B70" />

  <!-- Arms - One gesturing toward the clock -->
  <path d="M52 140 C42 148 38 160 46 168" stroke="#126B70" stroke-width="8" stroke-linecap="round" fill="none" />
  <path d="M148 140 C154 148 152 165 140 170" stroke="#126B70" stroke-width="8" stroke-linecap="round" fill="none" />

  <!-- Capsule Body Base -->
  <defs>
    <clipPath id="capsule-clip-reminder">
      <rect x="50" y="30" width="100" height="175" rx="50" />
    </clipPath>
  </defs>

  <rect x="50" y="30" width="100" height="175" rx="50" fill="#FFF9F1" stroke="#233444" stroke-width="6" />

  <g clip-path="url(#capsule-clip-reminder)">
    <path d="M45 120 L155 120 L155 210 L45 210 Z" fill="#168C89" />
    <line x1="45" y1="120" x2="155" y2="120" stroke="#233444" stroke-width="5" />
    <path d="M58 128 C58 155 60 175 75 190" stroke="#48C7B8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M100 162 C100 162 86 150 86 141 C86 135 91 131 96 131 C99 131 100 133 100 133 C100 133 101 131 104 131 C109 131 114 135 114 141 C114 150 100 162 100 162 Z" fill="#FFFFFF" />
  </g>

  <path d="M66 52 C72 44 82 40 98 40" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.8" />

  <!-- Alert, focused friendly eyes -->
  <circle cx="82" cy="85" r="7" fill="#233444" />
  <circle cx="84" cy="83" r="2.5" fill="#FFFFFF" />
  <circle cx="118" cy="85" r="7" fill="#233444" />
  <circle cx="120" cy="83" r="2.5" fill="#FFFFFF" />

  <ellipse cx="73" cy="95" rx="6" ry="4" fill="#FFAAA6" opacity="0.8" />
  <ellipse cx="127" cy="95" rx="6" ry="4" fill="#FFAAA6" opacity="0.8" />

  <path d="M92 93 Q100 102 108 93" stroke="#233444" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Alarm Clock beside Medi -->
  <g transform="translate(132, 130)">
    <!-- Bells -->
    <circle cx="9" cy="6" r="6" fill="#F59E0B" stroke="#233444" stroke-width="2" />
    <circle cx="35" cy="6" r="6" fill="#F59E0B" stroke="#233444" stroke-width="2" />
    <line x1="14" y1="8" x2="30" y2="8" stroke="#233444" stroke-width="2" />
    <!-- Clock Feet -->
    <line x1="12" y1="42" x2="6" y2="48" stroke="#233444" stroke-width="3" stroke-linecap="round" />
    <line x1="32" y1="42" x2="38" y2="48" stroke="#233444" stroke-width="3" stroke-linecap="round" />
    <!-- Clock Body -->
    <circle cx="22" cy="24" r="20" fill="#E63946" stroke="#233444" stroke-width="3" />
    <circle cx="22" cy="24" r="15" fill="#FFFFFF" />
    <!-- Clock Hands (at 8:30) -->
    <line x1="22" y1="24" x2="16" y2="28" stroke="#233444" stroke-width="2.5" stroke-linecap="round" />
    <line x1="22" y1="24" x2="22" y2="14" stroke="#233444" stroke-width="2" stroke-linecap="round" />
    <circle cx="22" cy="24" r="2" fill="#233444" />
    <!-- Ring Vibration Waves -->
    <path d="M4 14 Q0 18 4 22" stroke="#F59E0B" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M40 14 Q44 18 40 22" stroke="#F59E0B" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>
</svg>
