<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Soft shadow -->
  <ellipse cx="100" cy="225" rx="55" ry="10" fill="#168C89" opacity="0.15" />

  <!-- Feet -->
  <rect x="74" y="200" width="16" height="22" rx="8" fill="#126B70" />
  <rect x="110" y="200" width="16" height="22" rx="8" fill="#126B70" />

  <!-- Arms - One touching chin/cheek in thought -->
  <path d="M52 140 C42 145 38 155 45 165" stroke="#126B70" stroke-width="8" stroke-linecap="round" fill="none" />
  <path d="M148 140 C140 120 125 105 116 102" stroke="#126B70" stroke-width="8" stroke-linecap="round" fill="none" />

  <!-- Capsule Body Base -->
  <defs>
    <clipPath id="capsule-clip-thinking">
      <rect x="50" y="30" width="100" height="175" rx="50" />
    </clipPath>
  </defs>

  <rect x="50" y="30" width="100" height="175" rx="50" fill="#FFF9F1" stroke="#233444" stroke-width="6" />

  <g clip-path="url(#capsule-clip-thinking)">
    <path d="M45 120 L155 120 L155 210 L45 210 Z" fill="#168C89" />
    <line x1="45" y1="120" x2="155" y2="120" stroke="#233444" stroke-width="5" />
    <path d="M58 128 C58 155 60 175 75 190" stroke="#48C7B8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M100 162 C100 162 86 150 86 141 C86 135 91 131 96 131 C99 131 100 133 100 133 C100 133 101 131 104 131 C109 131 114 135 114 141 C114 150 100 162 100 162 Z" fill="#FFFFFF" />
  </g>

  <path d="M66 52 C72 44 82 40 98 40" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.8" />

  <!-- Thinking Face - Looking upward slightly -->
  <circle cx="82" cy="81" r="7" fill="#233444" />
  <circle cx="84" cy="78" r="2.5" fill="#FFFFFF" />
  <circle cx="118" cy="81" r="7" fill="#233444" />
  <circle cx="120" cy="78" r="2.5" fill="#FFFFFF" />

  <!-- Rosy Cheeks -->
  <ellipse cx="73" cy="93" rx="6" ry="4" fill="#FFAAA6" opacity="0.8" />
  <ellipse cx="127" cy="93" rx="6" ry="4" fill="#FFAAA6" opacity="0.8" />

  <!-- Curious curved mouth -->
  <ellipse cx="98" cy="95" rx="4" ry="5" fill="#233444" />

  <!-- Question mark floating above -->
  <g transform="translate(142, 28)">
    <circle cx="18" cy="18" r="16" fill="#EDE7FF" stroke="#A78BFA" stroke-width="2" />
    <text x="18" y="24" font-family="sans-serif" font-size="20" font-weight="900" fill="#7C3AED" text-anchor="middle">?</text>
  </g>
</svg>
