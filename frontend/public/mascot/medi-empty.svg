<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Soft shadow -->
  <ellipse cx="100" cy="225" rx="60" ry="10" fill="#168C89" opacity="0.15" />

  <!-- Sitting posture with feet in front -->
  <rect x="68" y="196" width="22" height="15" rx="7.5" fill="#126B70" />
  <rect x="110" y="196" width="22" height="15" rx="7.5" fill="#126B70" />

  <!-- Resting arms -->
  <path d="M52 145 C48 160 55 178 72 178" stroke="#126B70" stroke-width="8" stroke-linecap="round" fill="none" />
  <path d="M148 145 C152 160 145 178 128 178" stroke="#126B70" stroke-width="8" stroke-linecap="round" fill="none" />

  <!-- Capsule Body with slight cute tilt -->
  <g transform="rotate(4 100 120)">
    <defs>
      <clipPath id="capsule-clip-empty">
        <rect x="50" y="32" width="100" height="170" rx="50" />
      </clipPath>
    </defs>

    <rect x="50" y="32" width="100" height="170" rx="50" fill="#FFF9F1" stroke="#233444" stroke-width="6" />

    <g clip-path="url(#capsule-clip-empty)">
      <path d="M45 120 L155 120 L155 210 L45 210 Z" fill="#168C89" />
      <line x1="45" y1="120" x2="155" y2="120" stroke="#233444" stroke-width="5" />
      <path d="M58 128 C58 155 60 175 75 190" stroke="#48C7B8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6" />
      <path d="M100 162 C100 162 86 150 86 141 C86 135 91 131 96 131 C99 131 100 133 100 133 C100 133 101 131 104 131 C109 131 114 135 114 141 C114 150 100 162 100 162 Z" fill="#FFFFFF" />
    </g>

    <path d="M66 52 C72 44 82 40 98 40" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.8" />

    <!-- Cute eyes with head tilt -->
    <circle cx="82" cy="85" r="7" fill="#233444" />
    <circle cx="84" cy="83" r="2.5" fill="#FFFFFF" />
    <circle cx="118" cy="85" r="7" fill="#233444" />
    <circle cx="120" cy="83" r="2.5" fill="#FFFFFF" />

    <ellipse cx="73" cy="95" rx="6" ry="4" fill="#FFAAA6" opacity="0.8" />
    <ellipse cx="127" cy="95" rx="6" ry="4" fill="#FFAAA6" opacity="0.8" />

    <path d="M93 93 Q100 99 107 93" stroke="#233444" stroke-width="3.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Thought dots -->
  <circle cx="148" cy="72" r="3" fill="#A78BFA" opacity="0.7" />
  <circle cx="158" cy="62" r="4.5" fill="#A78BFA" opacity="0.7" />
  <g transform="translate(155, 30)">
    <rect x="0" y="0" width="30" height="24" rx="8" fill="#EDE7FF" stroke="#A78BFA" stroke-width="1.5" />
    <circle cx="9" cy="12" r="2" fill="#7C3AED" />
    <circle cx="15" cy="12" r="2" fill="#7C3AED" />
    <circle cx="21" cy="12" r="2" fill="#7C3AED" />
  </g>
</svg>
